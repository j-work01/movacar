<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movacar transfer board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#33363C;
    --plate:#F4F4F1;
    --ink:#15171B;
    --eu-blue:#003399;
    --eu-yellow:#FFCC00;
    --stamp:#C8102E;
    --rule:#C6C8C2;
    --muted:#6B6F76;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Archivo', ui-sans-serif, system-ui, sans-serif;
    --heavy:'Archivo Black','Archivo', ui-sans-serif, system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--asphalt);
    background-image:radial-gradient(circle at 18% 10%,#3C4047 0%,transparent 55%),
                     radial-gradient(circle at 84% 90%,#3A3D44 0%,transparent 50%);
    color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
    padding:26px 18px 60px;
  }
  .wrap{max-width:1240px;margin:0 auto}

  /* signature: the header is a European number plate */
  .plate{display:flex;background:var(--plate);border:3px solid var(--ink);
    border-radius:9px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.42)}
  .band{background:var(--eu-blue);width:54px;flex:0 0 54px;display:flex;
    flex-direction:column;align-items:center;justify-content:space-between;padding:11px 0 9px}
  .band-code{font-family:var(--heavy);font-size:15px;color:#fff}
  .plate-body{flex:1;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:13px 18px;flex-wrap:wrap}
  .plate-title{font-family:var(--heavy);font-size:clamp(20px,3.2vw,31px);letter-spacing:.055em;
    text-transform:uppercase;line-height:1;margin:0}
  .plate-sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-top:7px}

  button{font-family:var(--sans);font-weight:600;font-size:13.5px;letter-spacing:.03em;
    padding:9px 16px;border-radius:5px;cursor:pointer;border:2px solid var(--ink);
    background:var(--eu-yellow);color:var(--ink);transition:transform .1s,box-shadow .1s}
  button:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--ink)}
  button:active{transform:translateY(1px);box-shadow:none}
  button:focus-visible{outline:3px solid var(--eu-blue);outline-offset:2px}
  button[disabled]{opacity:.5;cursor:wait;transform:none;box-shadow:none}
  button.ghost{background:transparent;border-color:var(--rule);font-size:12.5px;padding:8px 13px}
  button.ghost:hover{border-color:var(--ink)}
  button.ghost[aria-expanded=true]{border-color:var(--ink);background:#DEDEDA}

  .card{background:var(--plate);border:2px solid var(--ink);border-radius:7px;
    margin-top:18px;box-shadow:0 10px 26px rgba(0,0,0,.3);overflow:hidden}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 14px;border-bottom:2px solid var(--ink);background:#EAEAE6}
  .bar h2{font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin:0}
  .filters{border-bottom:2px solid var(--ink)}
  .filters .bar{border-bottom:0}
  .filters .bar + .bar{border-top:1px solid var(--rule)}
  .grow{flex:1}
  .grp{display:inline-flex;align-items:center;gap:8px;margin-right:8px}
  .lbl{font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .dash{color:var(--muted)}
  .count{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  .seg{display:inline-flex;border:2px solid var(--ink);border-radius:5px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent;padding:6px 11px;
    font-size:12px;letter-spacing:.05em;text-transform:uppercase}
  .seg button:hover{transform:none;box-shadow:none;background:#DEDEDA}
  .seg button[aria-pressed=true]{background:var(--eu-blue);color:#fff}
  .seg button + button{border-left:2px solid var(--ink)}
  #euro[aria-pressed=true]{background:var(--stamp);color:#fff;border-color:var(--stamp)}

  input[type=text],input[type=date],select{font-family:var(--mono);font-size:13px;padding:8px 11px;
    border:2px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink)}
  input[type=text]{min-width:210px}
  input[type=date]{padding:6px 8px}
  select{padding:7px 8px;cursor:pointer;max-width:200px}
  input:focus,select:focus{outline:none;border-color:var(--eu-blue)}
  .set{border-color:var(--eu-blue);background:#EEF2FB}

  .chips{flex:1 1 300px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;
    padding:4px 9px 4px 7px;border:1.5px solid var(--ink);border-radius:4px;background:var(--plate);
    cursor:pointer;user-select:none}
  .chip input{margin:0;accent-color:var(--eu-blue);cursor:pointer}
  .chip.off{border-color:var(--rule);color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
  thead th{position:sticky;top:0;z-index:1;background:#EAEAE6;text-align:left;
    padding:8px 10px;font-family:var(--sans);font-weight:700;font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    border-bottom:2px solid var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
  thead th:hover{color:var(--ink)}
  thead th .arw{opacity:.3;margin-left:3px}
  thead th[data-on="1"]{color:var(--ink)}
  thead th[data-on="1"] .arw{opacity:1;color:var(--eu-blue)}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
  tbody tr:hover{background:#EDEDE9}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.city{font-weight:600;white-space:normal;min-width:96px}
  td.veh{white-space:normal;min-width:150px;max-width:230px}
  .scroll{max-height:70vh;overflow:auto}

  .price{display:inline-block;font-family:var(--heavy);font-size:11.5px;
    padding:2px 7px;border:1.5px solid var(--ink);border-radius:3px;background:var(--plate)}
  .price.one{background:var(--stamp);color:#fff;border-color:var(--stamp)}
  .price.low{background:var(--eu-yellow)}
  .xd{color:var(--eu-blue);font-size:11px;margin-left:1px}
  .tag{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;padding:2px 6px;border-radius:3px;background:#DEDEDA;color:var(--ink)}
  .tag.camper{background:var(--eu-blue);color:#fff}
  .tag.electric{background:#0B7A4B;color:#fff}
  /* country codes echo the plate's blue band */
  .cc{display:inline-block;min-width:26px;text-align:center;font-family:var(--heavy);font-size:10.5px;
    letter-spacing:.05em;padding:2px 5px;border-radius:3px;background:var(--eu-blue);color:#fff;cursor:help}
  a{color:var(--eu-blue);text-decoration:none;border-bottom:1px solid rgba(0,51,153,.3)}
  a:hover{border-bottom-color:var(--eu-blue)}

  .status{font-family:var(--mono);font-size:12.5px;padding:13px 14px;color:var(--muted)}
  .status.err{color:var(--stamp);background:#FBEAEC;border-top:1px solid var(--rule)}
  .status.err b{display:block;font-family:var(--sans);margin-bottom:4px}
  .empty{padding:32px 14px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}
  code{font-family:var(--mono);font-size:12px;background:#E4E4E0;padding:1px 5px;border-radius:3px}
  .foot{color:#9AA0A8;font-family:var(--mono);font-size:11.5px;text-align:center;
    margin-top:24px;letter-spacing:.04em}
  .foot code{background:rgba(255,255,255,.1);color:#C3C8D0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:620px){.band{width:40px;flex:0 0 40px}tbody td,thead th{padding:6px 7px}
    body{padding:18px 16px 48px}input[type=text]{min-width:0;flex:1}
    .grp{flex-wrap:wrap}.route{flex:1 1 100%}.route select{flex:1;min-width:0;max-width:none}}
</style>
</head>
<body>
<div class="wrap">

  <header class="plate">
    <div class="band">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><g fill="#FFCC00">
        <circle cx="12" cy="4" r="1.15"/><circle cx="16" cy="5.07" r="1.15"/>
        <circle cx="18.93" cy="8" r="1.15"/><circle cx="20" cy="12" r="1.15"/>
        <circle cx="18.93" cy="16" r="1.15"/><circle cx="16" cy="18.93" r="1.15"/>
        <circle cx="12" cy="20" r="1.15"/><circle cx="8" cy="18.93" r="1.15"/>
        <circle cx="5.07" cy="16" r="1.15"/><circle cx="4" cy="12" r="1.15"/>
        <circle cx="5.07" cy="8" r="1.15"/><circle cx="8" cy="5.07" r="1.15"/>
      </g></svg>
      <span class="band-code">MC</span>
    </div>
    <div class="plate-body">
      <div>
        <h1 class="plate-title">Transfer board</h1>
        <div class="plate-sub" id="stamp">starting…</div>
      </div>
      <button id="reload">Reload</button>
    </div>
  </header>

  <section class="card">
    <div class="filters">
      <div class="bar">
        <h2>Offers</h2>
        <input type="text" id="q" placeholder="city, country or vehicle…" autocomplete="off">
        <div class="seg" role="group" aria-label="Vehicle type">
          <button data-kind="all" aria-pressed="true">All</button>
          <button data-kind="Car" aria-pressed="false">Car</button>
          <button data-kind="Camper" aria-pressed="false">Camper</button>
          <button data-kind="Transporter / 9-Seater" aria-pressed="false">Van</button>
        </div>
        <button class="ghost" id="euro" aria-pressed="false">1 € only</button>
        <span class="grow"></span>
        <span class="count" id="count"></span>
        <button class="ghost" id="csv">CSV</button>
      </div>
      <div class="bar">
        <span class="grp">
          <span class="lbl">Date</span>
          <span class="seg" role="group" aria-label="Filter dates by">
            <button data-dmode="pickup" aria-pressed="true">Pick-up</button>
            <button data-dmode="return_by" aria-pressed="false">Return by</button>
          </span>
        </span>
        <span class="grp">
          <input type="date" id="d1" aria-label="Earliest date">
          <span class="dash">–</span>
          <input type="date" id="d2" aria-label="Latest date">
          <button class="ghost" id="dclear" hidden>Clear</button>
        </span>
        <span class="grp route">
          <span class="lbl">Route</span>
          <select id="cfrom" aria-label="From country"><option value="">any</option></select>
          <span class="dash">→</span>
          <select id="cto" aria-label="To country"><option value="">any</option></select>
        </span>
        <span class="grow"></span>
        <button class="ghost" id="colbtn" aria-expanded="false" aria-controls="colbar">Columns</button>
      </div>
      <div class="bar" id="colbar" hidden>
        <span class="lbl">Show</span>
        <div class="chips" id="chips"></div>
        <button class="ghost" id="colall">Show all</button>
      </div>
    </div>
    <div class="scroll"><div id="tbl"><div class="empty">Loading…</div></div></div>
    <div id="status"></div>
  </section>

  <section class="card">
    <div class="bar">
      <h2>Pick-up locations</h2>
      <span class="grow"></span>
      <button class="ghost" id="csvloc">CSV</button>
    </div>
    <div class="scroll" style="max-height:40vh"><div id="loctbl"><div class="empty">Loading…</div></div></div>
  </section>

  <p class="foot">
    Reads <code>/v1/locations/offers</code> then <code>/v1/offers?origin=…</code> ·
    no login · one request per pick-up city, paced 300&nbsp;ms apart<br>
    countries are worked out from station coordinates (Natural Earth borders) and postcodes
  </p>
</div>

<script>
(function () {
  'use strict';

  var BASE = 'https://crowd-api-production-615013621295.europe-west1.run.app/v1';
  var SITE = 'https://movacar.com';
  var LOCALE = 'en';

  // The API returns i18n keys for these fields; the site resolves them from a
  // translation bundle that has no CORS headers, so the labels live here instead.
  var LABEL = {
    crowd_vehicle_type_0:'Car', crowd_vehicle_type_1:'Electric Car',
    crowd_vehicle_type_2:'Transporter / 9-Seater', crowd_vehicle_type_5:'Camper',
    crowd_vehicle_fuel_type_0:'Petrol', crowd_vehicle_fuel_type_1:'Diesel',
    crowd_vehicle_fuel_type_2:'Hybrid', crowd_vehicle_fuel_type_3:'Electric',
    crowd_vehicle_fuel_type_4:'Hydrogen', crowd_vehicle_fuel_type_5:'Autogas (LPG)',
    crowd_vehicle_fuel_type_6:'MultiFuel', crowd_vehicle_fuel_type_7:'Ethanol',
    crowd_vehicle_fuel_type_10:'Unspecified',
    crowd_vehicle_gear_type_0:'Manual', crowd_vehicle_gear_type_1:'Automatic',
    crowd_vehicle_gear_type_2:'Manual/Auto',
    crowd_refuel_policy_0:'Fuel not included', crowd_refuel_policy_1:'1st tank incl.',
    crowd_refuel_policy_2:'Fuel included', crowd_refuel_policy_3:'Full-Full, reimbursed',
    crowd_refuel_policy_4:'Refuel to level at pick-up', crowd_refuel_policy_5:'1st tank incl.',
    crowd_refuel_policy_6:'Full-Full, up to 50 €', crowd_refuel_policy_9:'Route fuel incl.',
    crowd_refuel_policy_full:'Full-Full'
  };
  var lab = function (k) { return LABEL[k] || (k == null ? '' : String(k)); };

  var COUNTRY = {
    AD:'Andorra', AL:'Albania', AT:'Austria', BA:'Bosnia and Herzegovina', BE:'Belgium',
    BG:'Bulgaria', CH:'Switzerland', CZ:'Czechia', DE:'Germany', DK:'Denmark', EE:'Estonia',
    ES:'Spain', FI:'Finland', FR:'France', GB:'United Kingdom', GR:'Greece', HR:'Croatia',
    HU:'Hungary', IE:'Ireland', IS:'Iceland', IT:'Italy', LI:'Liechtenstein', LT:'Lithuania',
    LU:'Luxembourg', LV:'Latvia', MC:'Monaco', ME:'Montenegro', MK:'North Macedonia', MT:'Malta',
    NL:'Netherlands', NO:'Norway', PL:'Poland', PT:'Portugal', RO:'Romania', RS:'Serbia',
    SE:'Sweden', SI:'Slovenia', SK:'Slovakia', SM:'San Marino', VA:'Vatican City', XK:'Kosovo'
  };

  var offers = [], locs = [];
  var sort = { key: 'pickup', dir: 1 };
  var kind = 'all', euroOnly = false, dmode = 'pickup', hidden;
  var $ = function (i) { return document.getElementById(i); };

  // ------------------------------------------------------------------ network

  function getJSON(url) {
    return fetch(url, {
      // Accept is CORS-safelisted, so no preflight is triggered.
      headers: { 'Accept': 'application/vnd.api+json' },
      credentials: 'omit'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
      return r.json();
    });
  }

  function loadAll() {
    var btn = $('reload');
    btn.disabled = true;
    offers = []; locs = [];
    $('status').innerHTML = '';
    $('stamp').textContent = 'fetching locations…';

    getJSON(BASE + '/locations/offers?locale=' + LOCALE).then(function (p) {
      locs = (p.included || []).map(function (i) { return i.attributes; })
        .filter(function (a) { return a && typeof a.latitude === 'number'; });
      renderLocs();

      var origins = locs.filter(function (l) {
        return l.location_type === 'origin' && l.offer_count > 0;
      });
      if (!origins.length) throw new Error('no pick-up locations with offers');

      var i = 0, failed = 0;
      return (function step() {
        if (i >= origins.length) {
          if (failed) $('status').innerHTML =
            '<div class="status">' + failed + ' of ' + origins.length + ' cities failed to load.</div>';
          return;
        }
        var o = origins[i++];
        $('stamp').textContent = 'loading offers ' + i + '/' + origins.length + ' · ' + o.name;
        return getJSON(BASE + '/offers?locale=' + LOCALE + '&origin=' + encodeURIComponent(o.reference))
          .then(function (payload) {
            offers = offers.concat(parse(payload, o));
            syncCountries();
            render();
          })
          .catch(function () { failed++; })
          .then(function () {
            return new Promise(function (r) { setTimeout(r, 300); }).then(step);  // stay polite
          });
      })();
    }).then(function () {
      stamp();
    }).catch(function (e) {
      var msg = String(e && e.message || e);
      $('status').innerHTML = '<div class="status err"><b>Request failed — ' + esc(msg) + '</b>' +
        (/Failed to fetch|NetworkError|Load failed/i.test(msg)
          ? 'The browser blocked the request or the network is down. If this file is on your desktop, ' +
            'serve it instead: run <code>python3 -m http.server 8000</code> in that folder and open ' +
            '<code>http://localhost:8000/movacar-board.html</code>.'
          : 'The endpoint answered in an unexpected shape — it may have changed. Re-capture it in DevTools.') +
        '</div>';
      $('stamp').textContent = 'failed';
    }).then(function () { btn.disabled = false; });
  }

  // ------------------------------------------------------------------ parsing

  // Movacar stores local (Central European) dates as UTC instants, so the
  // earliest pick-up on 22 Sep arrives as 2026-09-21T22:00:00Z. Read them back
  // on Berlin time. End-of-day stamps sometimes spill just past midnight
  // (22:59:59Z in summer), so those are pulled back a few hours first.
  var BERLIN = new Intl.DateTimeFormat('en-GB',
    { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit' });
  function day(iso, backHours) {
    var t = Date.parse(iso || '');
    if (isNaN(t)) return (iso || '').slice(0, 10);
    var p = {};
    BERLIN.formatToParts(new Date(t - (backHours || 0) * 36e5))
      .forEach(function (x) { p[x.type] = x.value; });
    return p.year + '-' + p.month + '-' + p.day;
  }

  function parse(payload, origin) {
    var inc = {};
    (payload.included || []).forEach(function (i) { inc[i.type + ':' + i.id] = i.attributes || {}; });

    return (payload.data || []).map(function (o) {
      var a = o.attributes || {}, r = o.relationships || {};
      var st = function (k) {
        return (r[k] && r[k].data) ? (inc['station:' + r[k].data.id] || {}) : {};
      };
      var from = st('origin'), to = st('destination');
      var pr = (r.base_price && r.base_price.data)
        ? (inc['monetary_amount:' + r.base_price.data.id] || {}) : {};
      var amt = typeof pr.amount_minor_units === 'number' ? pr.amount_minor_units / 100 : null;

      // `period` is the included rental in hours; `extra_period` is the ceiling
      // once you buy extra days. The difference is what's purchasable on top.
      var per = typeof a.period === 'number' ? a.period : null;
      var cap = typeof a.extra_period === 'number' ? a.extra_period : null;
      var extra = (per !== null && cap !== null && cap > per) ? Math.round((cap - per) / 24) : 0;

      var fcc = countryOf(from) || countryOf(origin), tcc = countryOf(to);

      return {
        from: from.city || origin.name || '',
        from_cc: fcc,
        from_country: COUNTRY[fcc] || fcc,
        to: to.city || '',
        to_cc: tcc,
        to_country: COUNTRY[tcc] || tcc,
        vehicle: a.model || a.make || a.vehicle_category_name || '',
        kind: lab(a.vehicle_type),
        // the site's "Earliest Pickup" and "Latest Delivery"; `valid_until` is
        // the last day to collect (it sits exactly `period` before end_date)
        pickup: day(a.start_date),
        last_pickup: day(a.valid_until, 3),
        return_by: day(a.end_date, 3),
        days: per ? Math.round(per / 24) : '',
        extra_days: extra,
        max_days: cap ? Math.round(cap / 24) : '',
        free_km: a.free_km || '',
        price: amt,
        currency: pr.currency || 'EUR',
        extra_km: typeof a.cents_per_extra_km === 'number' ? a.cents_per_extra_km / 100 : '',
        gear: lab(a.gear_type),
        fuel: lab(a.fuel_type),
        seats: a.seats || '',
        sleeps: a.sleeping || '',
        refuel: lab(a.refuel),
        route_km: a.distance ? Math.round(a.distance / 1000) : '',
        from_address: [from.street, from.postal_code, from.city].filter(Boolean).join(', '),
        to_address: [to.street, to.postal_code, to.city].filter(Boolean).join(', '),
        offer_id: a.offer_id || o.id || '',
        url: SITE + '/en-US/offers?origin=' + encodeURIComponent(origin.name) +
             '&oid=' + origin.reference
      };
    });
  }

  // ---------------------------------------------------------------- countries
  //
  // The API has no country field, so it comes from the station's coordinates:
  // Natural Earth 1:10m borders (public domain), simplified to ~0.6 km along
  // land borders and ~5 km along coasts, polyline-encoded at 0.001°. Each
  // shared border is stored once in ARCS; RINGS lists, per country, the arcs
  // (base 36, `~` = reversed) that close each outline. Data is at the bottom.

  // Near a border the simplified outlines can land a station on the wrong side,
  // so the postcode's shape settles it: 01630 can't be Swiss, 8620 can't be French.
  var POSTAL = [
    [/^\d{5}$/, 'DE FR IT ES FI EE HR MC SM VA ME BA RS XK SE CZ SK GR LT'],
    [/^\d{3} \d{2}$/, 'SE CZ SK GR'],
    [/^\d{4}$/, 'AT BE CH DK NO HU SI LU LI BG MK AL PT NL'],
    [/^\d{4} ?[A-Z]{2}$/i, 'NL'],
    [/^\d{4}-\d{3}$/, 'PT'],
    [/^\d{2}-\d{3}$/, 'PL'],
    [/^L-?\d{4}$/i, 'LU'],
    [/^LV-?\d{4}$/i, 'LV'],
    [/^LT-?\d{5}$/i, 'LT'],
    [/^AD\d{3}$/i, 'AD'],
    [/^[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}$/i, 'GB'],
    [/^[A-Z]\d{2} ?[A-Z\d]{4}$/i, 'IE']
  ];

  var geo = null, ccCache = {};

  function geoInit() {
    var arcs = ARCS.split(',').map(function (s) {
      var pts = [], i = 0, x = 0, y = 0;
      var num = function () {
        var r = 0, sh = 0, b;

  function kmTo(x, y, rings) {

    var near = geo.filter(function (g) {
      return x > g.box[0] - .5 && x < g.box[2] + .5 && y > g.box[1] - .5 && y < g.box[3] + .5;
    }).map(function (g) {

      var x = a[sort.key], y = b[sort.key];

  function render() {

    var head = cols.map(function (c) {
      var on = sort.key === c.k;
      return '<th data-k="' + c.k + '" data-on="' + (on ? 1 : 0) + '"' +
             (c.h ? ' title="' + c.l + '">' + c.h : '>' + c.l) +
             '<span class="arw">' + (on ? (sort.dir === 1 ? '▲' : '▼') : '↕') + '</span></th>';
    }).join('') + '<th style="cursor:default"></th>';

    var body = rows.map(function (o) {
      return '<tr>' + cols.map(function (c) {
        var v = o[c.k], cls = c.cls || (c.num ? 'num' : '');
        if (c.k === 'price') {
          var t = v === null ? '—'
                : (v <= 1 ? '1 €' : v.toFixed(v % 1 ? 2 : 0) + ' ' + (o.currency === 'EUR' ? '€' : o.currency));
          var m = v === null ? '' : v <= 1 ? ' one' : v <= 20 ? ' low' : '';
          return '<td class="num"><span class="price' + m + '">' + t + '</span></td>';
        }
        if (c.k === 'days') {
          if (v === '' || v === null) return '<td class="num">—</td>';
          var ttl = o.extra_days
            ? v + ' days included, up to ' + o.extra_days + ' more purchasable (' + o.max_days + ' max)'
            : v + ' days included, no extra days available';
          return '<td class="num" title="' + esc(ttl) + '">' + v +

        }
        if (c.k === 'kind') {
          var kc = v === 'Camper' ? ' camper' : v === 'Electric Car' ? ' electric' : '';
          return '<td><span class="tag' + kc + '">' + esc(v || '—') + '</span></td>';
        }
        if (c.k === 'from_cc' || c.k === 'to_cc') {
          return '<td>' + (v ? '<span class="cc" title="' + esc(COUNTRY[v] || v) + '">' + esc(v) + '</span>' : '—') + '</td>';
        }

          return '<td title="Pick up any day from ' + v + ' to ' + esc(o.last_pickup) + '">' + v + '</td>';
        }
        return '<td class="' + cls + '">' + esc(v === '' || v === null ? '—' : v) + '</td>';

        var k = th.getAttribute('data-k');

  // Rebuilds the route dropdowns only when a new country shows up, so an open

      offers.forEach(function (o) { if (o[key]) seen[o[key]] = 1; });
      if (cur) seen[cur] = 1;
      var codes = Object.keys(seen).sort(function (a, b) {
        return (COUNTRY[a] || a).localeCompare(COUNTRY[b] || b);
