name: Deploy site

# Builds the site from main, adds the latest offer data from the `data`
# branch (if there is one) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets other workflows (such as the data refresh) publish the site too.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Add the latest offer data
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            mkdir -p public/data
            git archive FETCH_HEAD | tar -x -C public/data
            ls -la public/data
          else
            echo "No data branch yet, so the site is published without data."
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # One publish at a time; a newer one waits instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
